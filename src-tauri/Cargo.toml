[package]
name = "mailbub"
version = "0.1.0"
description = "Email as chat"
authors = ["mansfera"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mailbub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "sync", "io-util", "process"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.11"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
futures-util = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
hickory-resolver = "0.26.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "ring", "smtp-transport", "tokio1-rustls", "webpki-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
keyring-core = "1.0.1"
sha2 = "0.11.1"
base64 = "0.23.1"
mail-parser = "0.11.9"
regex = "1.13.1"
unicode-normalization = "0.1.26"
percent-encoding = "2.3.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = "0.6.5"
